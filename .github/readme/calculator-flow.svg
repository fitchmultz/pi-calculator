<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">A calculation in Pi</title>
  <desc id="desc">Ask Pi to calculate. Pi passes an expression to the calculator tool, which evaluates it with 40-significant-digit decimal precision. The tool returns a decimal string or flat array, or rejects an invalid expression with an error.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060A12"/>
      <stop offset="0.52" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#080C16"/>
    </linearGradient>
    <radialGradient id="blueBloom" cx="0.18" cy="0.18" r="0.8">
      <stop stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetBloom" cx="0.62" cy="0.42" r="0.7">
      <stop stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#172238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0E1525" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172554" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0.58"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#02040A" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#86EFAC"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#A78BFA"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .label { font: 600 24px Inter, ui-sans-serif, Arial, sans-serif; fill: #CBD5E1; }
      .heading { font: 650 32px Inter, ui-sans-serif, Arial, sans-serif; fill: #F8FAFC; }
      .copy { font: 450 24px Inter, ui-sans-serif, Arial, sans-serif; fill: #A9B7CF; }
      .connector { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Opaque canvas and restrained starter-token depth. -->
  <rect width="1600" height="600" fill="url(#canvas)"/>
  <rect width="1600" height="600" fill="url(#blueBloom)"/>
  <rect width="1600" height="600" fill="url(#violetBloom)"/>
  <rect width="1600" height="600" fill="url(#dotGrid)"/>
  <g class="sans">
    <text x="64" y="100" font-size="50" font-weight="700" letter-spacing="-1.4" fill="#F8FAFC">Ask Pi. Get a calculated answer.</text>
    <text x="64" y="148" class="copy">A calculator tool for arithmetic, scientific functions and statistics.</text>
  </g>

  <!-- One input path; success and error are alternative outcomes. -->
  <path d="M394 354H482" class="connector" stroke="#60A5FA" marker-end="url(#arrowBlue)"/>
  <path d="M1016 280H1120" class="connector" stroke="#86EFAC" marker-end="url(#arrowGreen)"/>
  <path d="M1016 448H1120" class="connector" stroke="#A78BFA" marker-end="url(#arrowViolet)"/>

  <g class="sans" filter="url(#shadow)">
    <!-- Human prompt -->
    <g transform="translate(64 234)">
      <rect width="330" height="240" rx="24" fill="url(#glass)" stroke="#2A3851"/>
      <rect width="5" height="240" rx="2.5" fill="#60A5FA"/>
      <rect x="28" y="28" width="46" height="42" rx="12" fill="#60A5FA" fill-opacity="0.12"/>
      <path d="M39 39h24v17H49l-7 6v-6h-3Z" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="92" y="58" class="heading">Ask Pi</text>
      <text x="28" y="116" class="copy">“Use the calculator</text>
      <text x="28" y="150" class="copy">to find 0.1 + 0.2.”</text>
      <text x="28" y="202" class="label" fill="#93C5FD">Pi sends the expression</text>
    </g>

    <!-- Primary subject -->
    <g transform="translate(482 212)">
      <rect width="534" height="288" rx="28" fill="url(#focus)" stroke="#6D7DFF" stroke-opacity="0.6"/>
      <circle cx="50" cy="50" r="22" fill="#A78BFA" fill-opacity="0.16"/>
      <path d="M42 42h16M50 34v16M42 58h16" stroke="#DDD6FE" stroke-width="2.5" stroke-linecap="round"/>
      <text x="86" y="60" class="heading">calculator</text>
      <text x="32" y="122" class="mono" font-size="34" fill="#F8FAFC">0.1 + 0.2</text>
      <text x="32" y="174" class="copy">Evaluate with decimal arithmetic</text>
      <g transform="translate(32 214)">
        <rect width="410" height="42" rx="21" fill="#0C1425" stroke="#51426F"/>
        <text x="205" y="29" text-anchor="middle" class="label" fill="#DDD6FE">40-significant-digit precision</text>
      </g>
    </g>

    <!-- Finite result -->
    <g transform="translate(1120 200)">
      <rect width="416" height="158" rx="24" fill="url(#glass)" stroke="#28513E"/>
      <path d="m1144 242 7 7 14-17" transform="translate(-1120 -200)" fill="none" stroke="#86EFAC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="48" class="heading">Decimal result</text>
      <text x="28" y="96" class="mono" font-size="36" fill="#86EFAC">0.3</text>
      <text x="28" y="133" class="copy">A string or flat array of strings</text>
    </g>

    <!-- Rejected expression -->
    <g transform="translate(1120 388)">
      <rect width="416" height="158" rx="24" fill="url(#glass)" stroke="#51426F"/>
      <circle cx="37" cy="39" r="15" fill="#A78BFA" fill-opacity="0.15"/>
      <path d="M37 30v10M37 46v1" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
      <text x="72" y="48" class="heading">Invalid expression</text>
      <text x="28" y="95" class="mono" font-size="30" fill="#DDD6FE">1 / 0 → error</text>
      <text x="28" y="132" class="copy">Rejected: division by zero</text>
    </g>
  </g>
</svg>
