name: npm version

on:
  push:
    branches: [main]
  check_run:
    types: [completed]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [npm release]
    types: [completed]
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: write

concurrency:
  group: npm-version-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    if: >-
      vars.NPM_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      github.repository_owner == 'fitchmultz' &&
      (github.event_name != 'check_run' ||
        github.event.check_run.app.slug == 'pi-durable' || github.event.check_run.app.slug == 'cursor') &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    uses: fitchmultz/.github/.github/workflows/npm-release-bump.yml@7abe40c5ce7add29b53e07efd9c4b95cd5713487 # main
    with:
      automation-ref: 7abe40c5ce7add29b53e07efd9c4b95cd5713487 # main
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
