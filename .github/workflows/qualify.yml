name: Pi compatibility check

on:
  workflow_call:
    inputs:
      automation-ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ inputs.automation-ref }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Qualify official Pi on the minimum Node version
        run: |
          npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
          version="$(node -p 'require("./extension/package.json").devDependencies["@earendil-works/pi-coding-agent"]')"
          GITHUB_STEP_SUMMARY=/dev/null node automation/scripts/qualify.mjs \
            --repo pi-calculator --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$version" --output "$RUNNER_TEMP/official-evidence"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - id: fork-target
        run: echo "ref=$(node -p 'require("./automation/host-targets.json").forkRef')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: ${{ steps.fork-target.outputs.ref }}
          path: fork
          persist-credentials: false
      - name: Build the pinned fork
        working-directory: fork
        env:
          FORK_REF: ${{ steps.fork-target.outputs.ref }}
        run: |
          required="$(node -p 'require("../automation/package.json").packageManager')"
          if [[ "npm@$(npm --version)" != "$required" ]]; then npm install --global "$required"; fi
          npm ci --ignore-scripts
          npm run hydrate:model-data
          git diff --exit-code
          PI_OFFLINE=1 PI_TELEMETRY=0 npm run build:offline
          PI_OFFLINE=1 PI_TELEMETRY=0 node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$FORK_REF"
          git diff --exit-code
      - name: Qualify the fork on Node 24
        env:
          PI_COMPAT_FORK_REF: ${{ steps.fork-target.outputs.ref }}
        run: |
          GITHUB_STEP_SUMMARY=/dev/null node automation/scripts/qualify.mjs \
            --repo pi-calculator --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/fork-evidence"
